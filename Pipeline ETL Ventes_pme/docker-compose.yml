services:
  db:
    image: postgres:16
    container_name: ventes_postgres
    environment:
      POSTGRES_DB: ventes_pme
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: ventes_app_postgres
    depends_on:
      - db
    volumes:
      - ./data:/data
      - ./app:/app
    working_dir: /app
    command: python main.py

  dashboard:
    build: .
    container_name: ventes_dashboard
    depends_on:
      - db
    volumes:
      - ./dashboard:/dashboard
    working_dir: /dashboard
    command: streamlit run dashboard.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"

volumes:
  postgres_data: